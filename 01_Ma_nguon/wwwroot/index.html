<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#943f28" />
    <meta
      name="description"
      content="Hệ thống tiếp nhận và theo dõi hồ sơ dịch vụ công"
    />
    <title>Cổng một cửa điện tử</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="app"><p class="loading" role="status">Đang tải hệ thống…</p></div>
    <div id="notice" class="toast" role="status" hidden></div>
    <dialog id="dialog" class="modal" aria-labelledby="dialog-title">
      <header>
        <h2 id="dialog-title"></h2>
        <button type="button" data-close aria-label="Đóng">×</button>
      </header>
      <div id="dialog-content" class="modal-body"></div>
    </dialog>
    <div id="case-print-sheet" aria-hidden="true"></div>
    <noscript
      >Vui lòng bật JavaScript để đăng nhập, nộp và theo dõi hồ sơ.</noscript
    >
  </body>
</html>
